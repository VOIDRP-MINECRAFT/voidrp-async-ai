name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build (with mod deps)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Neutralize local dev proxy (CI only)
        run: '[ -f gradle.properties ] && sed -i "/[Pp]roxy/d" gradle.properties || true'

      # build.gradle compiles a few mixins against other mods (compileOnly
      # ../minecraft_server/mods/<file>.jar, never shipped): Create, Immersive
      # Engineering, Sable, Ars Nouveau. Fetch each of those exact files from Modrinth —
      # the project is looked up by the jar's name, the file by its exact filename —
      # so a jar added to build.gradle is picked up without touching this workflow.
      - name: Fetch mod compile deps
        run: |
          api=https://api.modrinth.com/v2
          ua='voidrp-ci (github.com/VOIDRP-MINECRAFT)'
          gv='%5B%221.21.1%22%5D'
          mkdir -p ../minecraft_server/mods
          for jar in $(grep -oE "\.\./minecraft_server/mods/[^'\"]+\.jar" build.gradle | sort -u); do
            name=$(basename "$jar")
            base=$(echo "$name" | sed -E 's/-(neoforge-)?1\.21.*$//I')
            slug=$(echo "$base" | tr 'A-Z_' 'a-z-')
            query=$(jq -rn --arg q "${base//_/ }" '$q|@uri')
            ids="$slug $(curl -sSL -A "$ua" "$api/search?limit=5&query=$query&facets=%5B%5B%22versions:1.21.1%22%5D%5D" | jq -r '.hits[]?.project_id')"
            url=
            for id in $ids; do
              url=$(curl -sSL -A "$ua" "$api/project/$id/version?game_versions=$gv" \
                | jq -r --arg n "$name" 'if type == "array" then ([.[].files[] | select(.filename == $n) | .url][0] // empty) else empty end')
              [ -n "$url" ] && break
            done
            [ -n "$url" ] || { echo "::error::$name not found on Modrinth"; exit 1; }
            curl -sSL -A "$ua" -o "$jar" "$url"
            echo "$name <- $url"
          done
          ls -la ../minecraft_server/mods

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: '**/build/libs/*.jar'
          if-no-files-found: warn
          retention-days: 14

      # A tag like v1.2.0 publishes the built jars as a GitHub release, so the server
      # owner downloads a file instead of building one.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          generate_release_notes: true
